<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saúde Nampula - Centros de Saúde</title>
    <link rel="stylesheet" href="styles/centros.css">
    <link rel="icon" type="image/png" href="/img/monitor.png">
    <link rel="stylesheet" href="styles/darkmode.css">
    <script src="JS/loading.js"></script>
    <script src="https://pl30412009.effectivecpmnetwork.com/e0/32/e9/e032e9553695eb8f33d7773ddeb6b2d8.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5710780123165111"
     crossorigin="anonymous"></script>
</head>

<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <div class="logo">
                <div class="logo-icon">
                <img src="/img/monitor.png" alt="Saúde Nampula">
                </div>
                <h1>Saúde Nampula</h1>
            </div>


             <!-- Botão Hambúrguer -->
            <button class="menu-hamburguer" id="menuHamburguer" aria-label="Abrir menu">
                <span class="barra"></span>
                <span class="barra"></span>
                <span class="barra"></span>
            </button>

            
            <ul class="nav-links" id="navLinks">
                <li><a href="/home">Início</a></li>
                <li><a href="/hospital">Hospitais</a></li>
                <li><a href="/centros" class="active">Centros de Saúde</a></li>
                <li><a href="/farm">Farmácias</a></li>
                <li><a href="/emer">Emergências</a></li>
                <li><a href="/sobre">Sobre</a></li>
                <li><a href="/dicas">Informações</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Conteudo -->
    <main>
        <!-- Page Header -->
        <div class="page-header">
            <h2>Centros de Saúde</h2>
            <p class="page-subtitle">Unidades de saúde primária por bairro em Nampula</p>
        </div>

        <!-- Seccao de filtragem -->
        <div class="filter-section">
            <span class="filter-icon">🔍</span>
            <label for="bairro-filter" class="filter-label">Filtrar por Bairro:</label>
            <select id="bairro-filter" class="filter-select" onchange="filtrarCentros(this.value)">
                <option value="todos">Todos os Bairros</option>
                <option value="mucatine">Mucatine</option>
                <option value="muhala">Muhala</option>
                <option value="namicopo">Namicopo</option>
                <option value="centro">Centro</option>
                <option value="marrere">Marrere</option>
                <option value="napipine">Napipine</option>
                <option value="muatala">Muatala</option>
                <option value="moma">Moma</option>
                <option value="natikiri">Natikiri</option>
                <option value="nacala-a-velha">Nacala-a-Velha</option>
            </select>
        </div>

        <!-- Centros Grid -->
        <div class="centros-grid">
            <!-- Os centros serão carregados dinamicamente aqui -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 Saúde Nampula - Plataforma de Saúde Comunitária</p>
        <p class="footer-subtitle">Melhorando o acesso à saúde em Nampula</p>
    </footer>

    <!-- Script para carregar centros dinamicamente -->
     <!-- Adicionar antes dos outros scripts -->
<script src="JS/api-config.js"></script>
    <script src="JS/load-centros.js"></script>
    <script src="JS/geolocalizacao.js"></script>
    <script src="JS/avaliacoes-modal.js"></script>
    <script src="JS/menu-mobile.js"></script>
    <script src="JS/darkmode.js"></script>
</body>

</html>
