<head>

    <link rel="canonical" href="https://www.saudenampula.com/detalhes-farmacia">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Saúde Nampula">
    <meta property="og:title" content="Detalhes da Farmácia - Saúde Nampula">
    <meta property="og:description" content="Detalhes da farmácia em Nampula: endereço, contacto, horário e produtos.">

    <link rel="stylesheet" href="styles/darkmode.css">

</head>

<body>
    <div class="detalhes-container">
        <!-- O conteúdo será carregado dinamicamente pelo JavaScript -->
    </div>

    <!-- Seção de avaliações -->
    <div class="avaliacoes-section">
        <div id="avaliacoes-container"></div>
    </div>

    <script>
        // Inicializar avaliações para o estabelecimento específico
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if (id) {
                let tipo = 'farmacia';
                if (window.location.pathname.includes('hospital')) tipo = 'hospital';
                if (window.location.pathname.includes('centros')) tipo = 'centro';
                
                if (typeof inicializarAvaliacoes === 'function') {
                    inicializarAvaliacoes('avaliacoes-container', tipo, parseInt(id));
                }
            }
        });
    </script>

    <script src="JS/api-config.js"></script>
    <script src="JS/load-farmacias.js"></script>
    <script src="JS/geolocalizacao.js"></script>
    <script src="JS/darkmode.js"></script>
</body>

</html>
